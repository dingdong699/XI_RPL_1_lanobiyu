     <div class="main-container">
     <div class="form-container">
        <h1>Formulir Pengajuan Surat Izin</h1>

        <form action="proses_surat.php" method="post" target="_blank" onsubmit="return validasiForm()">
            <div class="form-group">
                <label for="nama">Nama Lengkap : </label>
                <input type="text" name="nama" id="nama" required placeholder="Masukan nama">
            </div>

            <div class="form-group">
                <label for="NIS">NIS : </label>
                <input type="number" name="nis" required placeholder="Masukan NIS anda">
            </div>

            <div class="form-group">
                <label for="kelas">Kelas : </label>
                <input type="text" name="kelas" id="kelas" required placeholder="Anda Kelas Berapa?">
            </div>

            <div class="form-group">
                <label for="alasan">Alasan Izin : </label>
               <select name="alasan" id="alasan" required>
                <option value="">---PILIH ALASAN--</option>
                <option value="sakit">Izin Sakit</option>
                <option value="acara">Izin Acara Keluarga</option>
                <option value="Sementara">Izin Keluar Sekolah Sementara</option>
                <option value="Terlambat">Izin Terlambat Masuk Sekolah</option>
                <option value="Keperluan Magang">Izin Keperluan Magang</option>
               </select>
            </div>

                <div class="form-now">
                    <div class="form-group half">
                        <label for="Tanggal Mulai">Tanggal Mulai : </label>
                        <input type="date" name="tgl_mulai" id="tgl_mulai" required>
                    </div>
                    <div class="form-group halfaw">
                        <label for="tanggal_selesai">Tanggal_selesai : </label>
                        <input type="date" name="tgl_selesai" id="tgl_selesai" required>
                    </div>
                    <div class="form-group">
                        <label for="keterangan">Keterangan : </label>
                        <textarea name="keterangan" id="keterangan" rows="3" placeholder="Masukan Keterangan Anda" required></textarea>
                    </div>
                    <button type="submit" class="btn-submit">Ajukan Surat</button>
                </div>
        </form>
     </div>
</body>
